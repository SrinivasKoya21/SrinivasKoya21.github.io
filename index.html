<style>
:root{

  --bronze:#a8662f; --silver:#78858f; --gold:#b1870c;
  --violet:#6d4aff; --rose:#d6336c; --teal:#0f9b8e; --amber:#e08700;
  --shadow:0 1px 2px rgba(13,27,36,.05),0 10px 30px -12px rgba(13,27,36,.16);

  --glow-a:rgba(12,107,138,.13); --glow-b:rgba(109,74,255,.09); --glow-c:rgba(15,155,142,.10);

  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --maxw:1120px;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1117; --bg-2:#0e171f; --surface:#111c25; --surface-2:#15212b;
    --ink:#e5edf2; --ink-2:#b2c0ca; --ink-3:#7f909c; --line:#1f2e39; --line-2:#2b3d4a;
    --accent:#5cc0de; --accent-soft:#12303c; --accent-2:#86d3ea;
    --bronze:#d08a4f; --silver:#aab6bf; --gold:#e0b93a;
    --violet:#a18bff; --rose:#ff7aa8; --teal:#4cd6c5; --amber:#ffb545;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 26px 54px -22px rgba(0,0,0,.75);
    --glow-a:rgba(92,192,222,.12); --glow-b:rgba(161,139,255,.10); --glow-c:rgba(76,214,197,.08);
    --tint:20%; --tint-line:42%; --tint-ink:#e2eaf0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1117; --bg-2:#0e171f; --surface:#111c25; --surface-2:#15212b;
  --ink:#e5edf2; --ink-2:#b2c0ca; --ink-3:#7f909c; --line:#1f2e39; --line-2:#2b3d4a;
  --accent:#5cc0de; --accent-soft:#12303c; --accent-2:#86d3ea;
  --bronze:#d08a4f; --silver:#aab6bf; --gold:#e0b93a;
  --violet:#a18bff; --rose:#ff7aa8; --teal:#4cd6c5; --amber:#ffb545;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 26px 54px -22px rgba(0,0,0,.75);
  --glow-a:rgba(92,192,222,.12); --glow-b:rgba(161,139,255,.10); --glow-c:rgba(76,214,197,.08);

}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .5s var(--ease),color .5s var(--ease)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(880px 520px at 88% -8%,var(--glow-a),transparent 62%),radial-gradient(720px 460px at -8% 22%,var(--glow-b),transparent 60%),radial-gradient(700px 500px at 60% 92%,var(--glow-c),transparent 62%)}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px;position:relative;z-index:1}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--violet))}
.grad{background:linear-gradient(100deg,var(--accent),var(--violet) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}

#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent),var(--violet),var(--teal));transition:width .12s linear}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);background:color-mix(in srgb,var(--bg) 76%,transparent);border-bottom:1px solid transparent;transition:border-color .35s,background-color .5s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;display:grid;place-items:center;font-size:.82rem;letter-spacing:0}
.brand span.dim{color:var(--accent)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;text-decoration:none;font-size:.9rem;color:var(--ink-2);padding:8px 11px;border-radius:9px;transition:color .25s var(--ease)}
.nav a::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--violet));transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.nav a.on{color:var(--ink)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .25s,transform .25s var(--ease),background-color .5s,box-shadow .25s}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px -10px var(--accent)}
.icon-btn svg{width:18px;height:18px;transition:transform .5s var(--ease)}
.icon-btn:hover svg{transform:rotate(18deg)}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .sun{display:block}:root:not([data-theme="light"]) .theme-btn .moon{display:none}}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:.93rem;padding:11px 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s,filter .3s;font-family:var(--f-body)}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(120deg,var(--accent),var(--violet));color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px var(--violet);filter:saturate(1.1)}
.btn-ghost{border-color:var(--line-2);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 24px -16px var(--accent)}
.btn-sm{padding:8px 14px;font-size:.86rem}
.menu-btn{display:none}
.mnav{display:none}
@media (max-width:900px){
  .nav,.hdr-actions .btn{display:none}
  .menu-btn{display:grid}
  .hdr-actions{margin-left:auto}
  .mnav{display:block;position:fixed;inset:66px 0 auto 0;z-index:49;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 22px;transform:translateY(-10px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .35s var(--ease)}
  .mnav.open{opacity:1;transform:none;pointer-events:auto}
  .mnav a{display:block;padding:12px 4px;text-decoration:none;border-bottom:1px solid var(--line);font-weight:500}
}

.view{animation:viewIn .6s var(--ease) both}
@keyframes viewIn{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
.js .pre{opacity:0;transform:translateY(18px)}
.js .pre.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}
section{padding-block:84px;position:relative;z-index:1}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:40px;max-width:720px}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.7rem);font-weight:700}
.sec-head p{color:var(--ink-2);font-size:1.05rem;max-width:62ch}

.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:56px;align-items:center}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--teal) 14%,transparent);color:color-mix(in srgb,var(--teal) 78%,var(--ink));font-size:.78rem;font-weight:600;border:1px solid color-mix(in srgb,var(--teal) 32%,transparent)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.quote{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-3);margin-top:16px}
.hero h1{font-size:clamp(2.5rem,6vw,4.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:16px}
.roll{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35em;font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,2.6vw,1.9rem);margin-top:18px;letter-spacing:-.02em;color:var(--ink-2)}
.roll-box{display:inline-block;height:1.25em;overflow:hidden;vertical-align:bottom;position:relative;transition:width .6s var(--ease)}
.roll-list{display:flex;flex-direction:column;align-items:flex-start;transition:transform .7s var(--ease)}
.roll-list span{height:1.25em;line-height:1.25em;color:var(--ink);white-space:nowrap;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--violet) 24%,transparent) 62%)}
.hero-copy{color:var(--ink-2);font-size:1.07rem;max-width:58ch;margin-top:22px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid var(--line)}
.stat{padding:18px 16px 4px 0;position:relative}
.stat+.stat{padding-left:18px;border-left:1px solid var(--line)}
.stat::before{content:"";position:absolute;top:-1px;left:0;width:34px;height:2px;border-radius:2px;background:var(--c,var(--accent))}
.stat+.stat::before{left:18px}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.5rem,2.6vw,2rem);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.stat span{font-size:.82rem;color:var(--ink-3);line-height:1.35;display:block;margin-top:2px}

.profile{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;transition:background-color .5s,border-color .5s,transform .5s var(--ease),box-shadow .5s var(--ease)}
.profile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.profile::before{content:"";position:absolute;inset:-1px;border-radius:25px;padding:1px;background:linear-gradient(140deg,var(--accent),var(--violet),var(--teal));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.photo{aspect-ratio:1/1;border-radius:50%;overflow:hidden;width:78%;max-width:100%;margin:6px auto 0;position:relative;box-shadow:0 0 0 6px var(--surface),0 0 0 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.profile h3{font-size:1.35rem;text-align:center;margin-top:20px}
.profile .role{text-align:center;color:var(--ink-3);font-size:.9rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chip{font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--c,var(--accent)) var(--tint),transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--accent)) var(--tint-line),transparent);
  color:var(--tint-ink);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--accent));flex:none}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px var(--c,var(--accent))}
.cert{display:flex;gap:12px;align-items:center;margin-top:18px;padding:12px 14px;border-radius:13px;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 14%,transparent),color-mix(in srgb,var(--rose) 10%,transparent));border:1px solid color-mix(in srgb,var(--gold) 34%,transparent)}
.cert .seal{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf3d,#ff6a3d);color:#3a2100}
.cert .seal svg{width:18px;height:18px}
.cert b{display:block;font-size:.88rem;line-height:1.3}
.cert span{font-size:.78rem;color:var(--ink-3)}

.pipe{margin-top:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px;box-shadow:var(--shadow);transition:background-color .5s,border-color .5s}
.pipe-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pipe-top .mono{color:var(--ink-3)}
.pipe-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;position:relative}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.node{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:500;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 52%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ink));
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.stage:hover .node{transform:translateY(-3px);box-shadow:0 10px 20px -12px var(--c)}
.stage small{font-size:.74rem;color:var(--ink-3);line-height:1.25}
.stage small b{display:block;color:var(--ink);font-weight:600;font-size:.8rem}
.track{position:absolute;left:10%;right:10%;top:23px;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px);z-index:1;overflow:hidden}
.pkt{position:absolute;top:-2px;left:0;width:20px;height:6px;border-radius:3px;background:var(--accent);animation:flow 4.6s linear infinite}
.pkt:nth-child(2){animation-delay:-1.5s;background:var(--bronze)}
.pkt:nth-child(3){animation-delay:-3s;background:var(--gold)}
@keyframes flow{from{transform:translateX(-24px)}to{transform:translateX(80vw)}}

.proj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;position:relative;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .35s,background-color .5s}
.proj::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 30%,var(--violet)));transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);z-index:3}
.proj:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line))}
.proj:hover::after{transform:scaleX(1)}
.proj.feature{grid-column:1/-1;display:grid;grid-template-columns:1.05fr 1fr}
.proj-art{background:linear-gradient(140deg,color-mix(in srgb,var(--c,var(--accent)) 12%,var(--bg-2)),var(--bg-2));border-bottom:1px solid var(--line);min-height:180px;position:relative;overflow:hidden}
.proj.feature .proj-art{border-bottom:0;border-right:1px solid var(--line);min-height:340px}
.proj-art svg{position:absolute;inset:0;width:100%;height:100%}
.proj-body{padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.proj-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:7px;
  color:color-mix(in srgb,var(--c,var(--accent)) 74%,var(--ink));background:color-mix(in srgb,var(--c,var(--accent)) var(--tint),transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.proj-meta .mono{color:var(--ink-3)}
.proj h3{font-size:1.36rem;font-weight:700}
.proj.feature h3{font-size:clamp(1.6rem,2.8vw,2.05rem)}
.proj p{color:var(--ink-2);font-size:.97rem}
.proj .chips{justify-content:flex-start;margin-top:auto;padding-top:6px}
.proj-link{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--ink));margin-top:4px}
.proj-link svg{width:15px;height:15px;transition:transform .35s var(--ease)}
.proj:hover .proj-link svg{transform:translateX(5px)}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.kpis div{font-size:.8rem;color:var(--ink-3)}
.kpis b{display:block;font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.02em;color:var(--k,var(--ink))}

.skill-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;position:relative;overflow:hidden;
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .35s,background-color .5s}
.skill::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,var(--violet)))}
.skill:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.skill h3{font-size:1.08rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.skill h3 .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,var(--violet)))}
.skill h3 .ic svg{width:17px;height:17px}

            <h3>CommercePulse: Real-Time E-Commerce Analytics &amp; ML Platform</h3>
            <p>An end-to-end platform I built and published: a Python event generator streams clickstream and order events through Event Hubs' Kafka API into PySpark Structured Streaming, across Bronze/Silver/Gold Delta tables on ADLS Gen2, out to Snowflake, into dbt marts and a Tableau dashboard — with DistilBERT sentiment and an MLflow-tracked LightGBM propensity model on top.</p>
            <div class="chips">

    <span class="eyebrow">How I Build</span>
    <h1>Six principles behind every pipeline I ship</h1>
    <p class="lede">The habits I've carried from SSIS warehouses to Databricks lakehouses. Each one is tied to something I've actually delivered.</p>
  </div>
  <div class="principles">
    <div class="pr" style="--c:var(--bronze)"><span class="mono">01 · Replayable</span><h3>Land raw, then refine</h3><p>Bronze stays append-only and schema-tracked so any downstream layer can be rebuilt from source. Bad logic becomes a re-run, not a data-loss incident.</p><p class="ev"><b>In practice:</b> Auto Loader + ADF into a Bronze/Silver/Gold lakehouse for 50+ sources at Lumen.</p></div>
    <div class="pr" style="--c:var(--silver)"><span class="mono">02 · History</span><h3>Never overwrite the past</h3><p>Dimensions keep their history with SCD Type 2, driven by CDC and Delta MERGE, so a report from last quarter still reconciles today.</p><p class="ev"><b>In practice:</b> CDC from Azure SQL and MySQL at under 5-minute latency; SCD2 across Silver and Gold.</p></div>
    <div class="pr" style="--c:var(--teal)"><span class="mono">03 · Trust</span><h3>Test the data, not only the code</h3><p>Expectations on nulls, ranges, uniqueness and freshness run in the pipeline, so bad batches are stopped before a dashboard shows them.</p><p class="ev"><b>In practice:</b> A Python quality framework on Great Expectations, plus dbt tests and pytest-checked transforms in CommercePulse.</p></div>
    <div class="pr" style="--c:var(--violet)"><span class="mono">04 · Performance</span><h3>Measure, then tune</h3><p>Partitioning, Z-ordering, shuffle sizing and checkpointing decide most of a job's cost. I profile first and change one thing at a time.</p><p class="ev"><b>In practice:</b> 50% faster batch, 2× streaming throughput, 60% faster Synapse queries.</p></div>
    <div class="pr" style="--c:var(--amber)"><span class="mono">05 · Cost</span><h3>Treat the cloud bill as a metric</h3><p>Compaction, archive tiers, auto-terminating clusters and infrastructure-as-code keep platforms lean without trading away reliability.</p><p class="ev"><b>In practice:</b> 35% lower infra cost with Terraform at Lumen; CommercePulse runs inside an Azure $200 trial with one-command teardown.</p></div>
    <div class="pr" style="--c:var(--rose)"><span class="mono">06 · Operability</span><h3>Built to be run, not just built</h3><p>Governed with Unity Catalog, deployed through CI/CD, watched by alerts. The pipeline should tell you it's unhealthy before a user does.</p><p class="ev"><b>In practice:</b> 99.9% uptime with Azure Monitor alerting; GitHub Actions and Databricks Asset Bundles on CommercePulse.</p></div>
  </div>
  <div class="callout"><p><strong>What I'm exploring now:</strong> streaming + ML on the lakehouse. CommercePulse runs DistilBERT sentiment and an MLflow-tracked LightGBM propensity model directly on top of a real-time Medallion pipeline.</p></div>

const root=document.documentElement;
root.classList.add('js');
const sysDark=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
try{const t=localStorage.getItem('sk-theme'); if(t==='dark'||t==='light') root.setAttribute('data-theme',t);}catch(e){}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=root.getAttribute('data-theme')||(sysDark()?'dark':'light');
  const nx=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',nx);
  try{localStorage.setItem('sk-theme',nx)}catch(e){}
});

const app=document.getElementById('app');
const SECTIONS=['home','projects','skills','domain','experience','education','achievements','contact'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let rollTimer=null, current='', io=null;
function revealAll(){document.querySelectorAll('.pre').forEach(el=>el.classList.add('in'))}
function setupReveal(){
  if(reduce||!('IntersectionObserver' in window)){revealAll();return}
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.05});
  document.querySelectorAll('.pre').forEach(el=>io.observe(el));
  setTimeout(revealAll,2500);
}
function render(){
  const h=decodeURIComponent(location.hash||'');
  let page='home', section=null;
  if(h.startsWith('#/')){
    const path=h.slice(2);
    if(path==='') page='home';
    else if(SECTIONS.includes(path)){page='home';section=path}
    else if(path==='how-i-build'||path==='resume') page=path;
    else if(path.startsWith('p/')&&PROJECTS[path.slice(2)]) page='p:'+path.slice(2);
  } else if(h.length>1){ section=h.slice(1); }
  if(page!==current){
    clearInterval(rollTimer);
    app.innerHTML = page.startsWith('p:') ? projectPage(page.slice(2)) : document.getElementById('t-'+page).innerHTML;
    current=page;
    document.title = page==='home' ? 'Srinivas Koya | Data Engineer'
      : page==='resume' ? 'Resume · Srinivas Koya'
      : page==='how-i-build' ? 'How I Build · Srinivas Koya'
      : PROJECTS[page.slice(2)].title+' · Srinivas Koya';
    if(page==='home') initHome();
    if(page==='resume'){const b=document.getElementById('printBtn'); b&&b.addEventListener('click',()=>window.print());}
    app.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);t&&t.scrollIntoView({behavior:'smooth',block:'start'})}));
    setupReveal();
    if(!section) window.scrollTo({top:0,behavior:'instant'});
  }
  if(section){const el=document.getElementById(section); if(el) requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'}));}
  closeMenu(); markNav(page);
}
function markNav(page){
  document.querySelectorAll('#nav a').forEach(a=>{
    const href=a.getAttribute('href');
    a.classList.toggle('on',(page==='how-i-build'&&href==='#/how-i-build')||(page==='resume'&&href==='#/resume')||(page.startsWith('p:')&&href==='#projects'));
  });
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const href=a.getAttribute('href');
  if(href.startsWith('#/')) return;
  const id=href.slice(1);
  if(!SECTIONS.includes(id)) return;
  e.preventDefault();
  if(current!=='home'){ location.hash='#/'+id; }
  else { const el=document.getElementById(id); el&&el.scrollIntoView({behavior:'smooth',block:'start'}); history.replaceState(null,'','#'+id); closeMenu(); }
});
window.addEventListener('hashchange',render);

function initHome(){
  const y=document.getElementById('yr'); if(y) y.textContent=new Date().getFullYear();
  const roll=document.getElementById('roll'); if(!roll) return;
  const n=roll.children.length, box=roll.parentElement; let i=0;
  const fit=()=>{box.style.width=roll.children[i].scrollWidth+'px'};
  fit();
  if(reduce) return;
  rollTimer=setInterval(()=>{
    i++; roll.style.transition='transform .7s cubic-bezier(.22,.8,.24,1)';
    roll.style.transform='translateY(-'+(i*1.25)+'em)'; fit();
    if(i===n-1){setTimeout(()=>{roll.style.transition='none';i=0;roll.style.transform='translateY(0)';fit()},720)}
  },2600);
}

const hdr=document.getElementById('hdr'), prog=document.getElementById('prog');
addEventListener('scroll',()=>{
  hdr.classList.toggle('scrolled',scrollY>8);
  const max=document.documentElement.scrollHeight-innerHeight;
  prog.style.width=(max>0?Math.min(scrollY/max*100,100):0)+'%';
},{passive:true});
const menuBtn=document.getElementById('menuBtn'), mnav=document.getElementById('mnav');
function closeMenu(){mnav.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.addEventListener('click',()=>{const o=mnav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(o))});

render();
</script>
